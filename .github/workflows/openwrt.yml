name: OpenWrt client

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'openwrt/**'
      - 'cmd/client/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/openwrt.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - i386_pentium4
          - aarch64_generic
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_arm1176jzf-s_vfp
          - mips_24kc
          - mipsel_24kc
          - mipsel_74kc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify packaging
        run: |
          python -m unittest discover -s openwrt -p 'test_*.py'
          go test ./openwrt
          node --check openwrt/luci-app-vnray/htdocs/luci-static/resources/view/vnray/client.js
          sh -n openwrt/vnray-client/files/vnray.init
      - name: Build client and packages
        env:
          VNRAY_ARCH: ${{ matrix.arch }}
        run: python openwrt/build.py --arch "$VNRAY_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: bin/openwrt/*.ipk
