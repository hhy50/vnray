name: release

# 打 v* 标签即发布；也可以在 Actions 页面手动触发，只产出构建物不建 Release。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "包名里的版本号（如 v0.0.1）；留空则取 internal/cli/version.go 的常量"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 交叉编译产物不需要 CGO：SQLite 用的是纯 Go 驱动（glebarez/sqlite）。
  CGO_ENABLED: "0"

jobs:
  check:
    name: 校验版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号只有 version.go 常量一个来源，tag 只决定包名与 Release 名。
      # 两者漂移时二进制里是旧版本、包名是新版本，用户会拿到自相矛盾的产物。
      - name: tag 与 version.go 常量一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          CONST=$(sed -nE 's/^const version = "([^"]+)".*/\1/p' internal/cli/version.go)
          if [ -z "$CONST" ]; then
            echo "::error::internal/cli/version.go 里没找到 const version = \"...\""
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          if [ "$CONST" != "$TAG" ] && [ "v$CONST" != "$TAG" ]; then
            echo "::error::tag $TAG 与 version.go 的 $CONST 不一致：先改常量再打 tag"
            exit 1
          fi
          echo "版本一致：$TAG"

  web:
    name: 构建管理台前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      # dist 不入库，但 web/admin/embed.go 用 go:embed 引了 dist/index.html，
      # 产物缺失时 go build 会直接失败，所以所有二进制都依赖这一步。
      - name: 安装依赖并构建
        working-directory: web/admin
        run: |
          npm ci
          npm run build

      # 打成单个 tar 传递，避免 artifact 对目录层级的处理差异，也省掉几千次小文件上传。
      - name: 打包前端产物
        run: tar -czf admin-dist.tar.gz -C web/admin dist

      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin-dist.tar.gz
          retention-days: 1

  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [web, check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # linux/mipsle 不在列：modernc.org/libc 没有该架构的实现，服务端编不过。
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: linux, goarch: "386" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: admin-dist

      - name: 解包前端产物
        run: tar -xzf admin-dist.tar.gz -C web/admin

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.tag }}"
            if [ -z "$V" ]; then
              V=$(sed -nE 's/^const version = "([^"]+)".*/\1/p' internal/cli/version.go)
            fi
            echo "value=${V:-dev}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: 编译并打包
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.goarm }}" ]; then export GOARM="${{ matrix.goarm }}"; fi

          SUFFIX=""
          if [ "$GOOS" = "windows" ]; then SUFFIX=".exe"; fi
          VERSION="${VERSION:-dev}"

          # -trimpath 去掉本机路径，-s -w 去符号表。
          # 版本号是 internal/cli/version.go 里的常量，发布前手改，构建不注入。
          go build -trimpath -ldflags "-s -w" -o "vnserver${SUFFIX}" ./cmd/server
          go build -trimpath -ldflags "-s -w" -o "vnclient${SUFFIX}" ./cmd/client

          NAME="vnray_${VERSION}_${GOOS}_${GOARCH}"
          STAGE="stage/${NAME}"
          mkdir -p "$STAGE" dist
          mv "vnserver${SUFFIX}" "vnclient${SUFFIX}" "$STAGE/"
          cp -r configs "$STAGE/"
          cp README.md README.zh-CN.md "$STAGE/"

          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -qr "../dist/${NAME}.zip" "$NAME")
          else
            tar -czf "dist/${NAME}.tar.gz" -C stage "$NAME"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist
          sha256sum ./* > checksums.txt
          cat checksums.txt

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 没有 checkout，gh 拿不到仓库上下文，必须显式指定。
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
