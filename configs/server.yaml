server:
  listen: 0.0.0.0:9000
  auth:
    # 留空时仅接受管理台生成的密钥；无管理台时填入 vnserver keygen 的输出。
    key: ""

admin:
  enabled: true
  listen: 0.0.0.0:8080
  username: admin
  password: admin

storage:
  driver: sqlite
  dsn: bindings.db

# diagnostics:
  # pprof_listen: 127.0.0.1:6060

plugin:
  enabled: ["v2ray"]

log:
  level: info
  output: log/server.log
  console: false
