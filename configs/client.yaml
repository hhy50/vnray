# vnray 客户端配置
# 用法: go run ./cmd/client -c configs/client.yaml

# 请求发起服务端的地址、握手密钥与断线重连策略。
# 客户端默认长期在线，连接失败或会话中断后按固定间隔不断重连。
server:
  addr: 127.0.0.1:9000
  # 安全握手使用的生成密钥；配置上报不会发送此密钥。
  auth_key: 2nC7NBBcutpkJg0cPkyQgkzXqtWrri/JB4QyXI5N258=
  reconnect:
    enabled: true
    interval: 10s

group: default
# 留空时使用 ${hostname}-${ip}
name: 

# 分发网络访问控制（支持 CIDR、IPv4 尾部通配、单 IP，逗号分隔）：
public: ""
private: ""

log:
  level: info
  output: stderr
  console: false

# 路由与出站配置
routing:
  default: direct
  outbounds:
    - tag: direct
      type: direct
    - tag: reject
      type: reject
      reason: domain blocked by client rule
  rules:
    - name: block-list
      outbound: reject
      match:
        domain_prefix: ["blocked."]
    - name: private-ip
      outbound: direct
      match:
        host: ["127.0.0.1"]
